<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACAPS Community – analyst view (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..700&display=swap" rel="stylesheet">
<script>
  // Same default as the expert app: teal dark, unless the analyst chose light.
  try { var t = localStorage.getItem("analystTheme"); document.documentElement.dataset.theme = t === "light" ? "light" : "dark"; } catch (e) {}
</script>
<style>
  /* Tokens follow frontend/src/styles/tokens.css: one logo blue, glass surfaces, red only for risk level. */
  :root {
    --ink: #0b1a22; --ink-2: #44515b; --accent: #0196ba; --primary: #0196ba; --on-primary: #ffffff;
    --ground: #d6e5f2;
    --app-bg:
      radial-gradient(110% 55% at 0% 0%, rgba(255,255,255,.85) 0%, transparent 60%),
      radial-gradient(80% 45% at 100% 28%, rgba(1,150,186,.3) 0%, transparent 70%),
      radial-gradient(90% 50% at 10% 95%, rgba(1,150,186,.24) 0%, transparent 70%),
      linear-gradient(180deg, #e6f0f8 0%, #c8dbec 100%);
    --surface: rgba(255,255,255,.55); --control: rgba(255,255,255,.62); --control-on: rgba(1,150,186,.16);
    --field: rgba(255,255,255,.42); --line: rgba(1,150,186,.16); --glass-line: rgba(255,255,255,.85); --glass-drop: rgba(0,48,90,.14);
    --soft-card: inset 0 0 0 1px var(--glass-line), 0 18px 44px var(--glass-drop);
    --soft-raised: inset 0 0 0 1px var(--glass-line), 0 4px 14px var(--glass-drop);
    --soft-pressed: inset 0 0 0 1px var(--glass-line), inset 0 2px 8px var(--glass-drop);
    --card-blur: blur(22px) saturate(160%);
    --level-high: #b8163c; --level-high-ink: #ffffff; --level-medium: #d97a8c; --level-medium-ink: #3d0613; --level-low: #efc3cc; --level-low-ink: #5c0a1e;
    --highlight: #d8d800; --scrim: rgba(4,22,29,.35);
    --map-land: rgba(255,255,255,.7); --map-up: #00566b; --map-flat: #0196ba; --map-down: #8fd0e2;
    --radius-card: 28px; --radius-control: 16px; --radius-pill: 999px;
    color-scheme: light; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f1f5f7; --ink-2: #b4c3cb; --accent: #1aa8cc; --primary: #0196ba; --on-primary: #ffffff; --ground: #031319;
      --app-bg:
        radial-gradient(75% 45% at 100% 0%, rgba(98,188,214,.7) 0%, rgba(34,128,158,.35) 38%, transparent 72%),
        radial-gradient(80% 50% at 85% 55%, rgba(14,92,116,.45) 0%, transparent 70%),
        radial-gradient(70% 45% at 30% 100%, rgba(0,0,0,.55) 0%, transparent 70%),
        linear-gradient(160deg, #010608 0%, #03161d 35%, #06303d 70%, #0b4c5f 100%);
      --surface: rgba(255,255,255,.07); --control: rgba(255,255,255,.08); --control-on: rgba(255,255,255,.16);
      --field: rgba(0,0,0,.25); --line: rgba(255,255,255,.12); --glass-line: rgba(255,255,255,.2); --glass-drop: rgba(0,0,0,.4);
      --level-high: #b8163c; --level-high-ink: #ffffff; --level-low: #5a2a35; --level-low-ink: #ffd9e1;
      --map-land: rgba(255,255,255,.1); --map-up: #9ee3f5; --map-flat: #1aa8cc; --map-down: #0f5466;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f1f5f7; --ink-2: #b4c3cb; --accent: #1aa8cc; --primary: #0196ba; --on-primary: #ffffff; --ground: #031319;
    --app-bg:
      radial-gradient(75% 45% at 100% 0%, rgba(98,188,214,.7) 0%, rgba(34,128,158,.35) 38%, transparent 72%),
      radial-gradient(80% 50% at 85% 55%, rgba(14,92,116,.45) 0%, transparent 70%),
      radial-gradient(70% 45% at 30% 100%, rgba(0,0,0,.55) 0%, transparent 70%),
      linear-gradient(160deg, #010608 0%, #03161d 35%, #06303d 70%, #0b4c5f 100%);
    --surface: rgba(255,255,255,.07); --control: rgba(255,255,255,.08); --control-on: rgba(255,255,255,.16);
    --field: rgba(0,0,0,.25); --line: rgba(255,255,255,.12); --glass-line: rgba(255,255,255,.2); --glass-drop: rgba(0,0,0,.4);
    --level-high: #b8163c; --level-high-ink: #ffffff; --level-low: #5a2a35; --level-low-ink: #ffd9e1;
    --map-land: rgba(255,255,255,.1); --map-up: #9ee3f5; --map-flat: #1aa8cc; --map-down: #0f5466;
    color-scheme: dark;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--ground); }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100%; background: var(--app-bg) fixed, var(--ground); color: var(--ink);
    font-family: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.45;
    font-optical-sizing: auto; font-variant-numeric: tabular-nums; }
  h1, h2, h3, h4, p { margin: 0; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .muted { color: var(--ink-2); font-size: 13.5px; }
  .expert { font-weight: 600; font-stretch: 75%; letter-spacing: .005em; }

  /* surfaces, as in the app */
  .soft-card { background: var(--surface); -webkit-backdrop-filter: var(--card-blur); backdrop-filter: var(--card-blur);
    border-radius: var(--radius-card); box-shadow: var(--soft-card); padding: 20px 22px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 0;
    border-radius: var(--radius-control); font-size: 14px; font-weight: 500; white-space: nowrap; transition: box-shadow .15s, color .15s; }
  .btn-pill { border-radius: var(--radius-pill); }
  .btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 6px 14px rgba(1,150,186,.28); }
  .btn-soft { background: var(--control); color: var(--ink); box-shadow: var(--soft-raised); }
  .btn-soft[aria-pressed="true"] { background: var(--control-on); box-shadow: var(--soft-pressed); color: var(--accent); font-weight: 600; }
  .link-btn { border: 0; background: none; color: var(--accent); font-size: 14px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; padding: 0 4px; min-height: 36px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 11px; border-radius: var(--radius-pill); font-size: 13.5px; font-weight: 500; line-height: 1; white-space: nowrap; border: 0; }
  .chip--area { background: var(--control); box-shadow: inset 0 0 0 1px var(--glass-line); color: var(--ink); }
  .chip--high { background: var(--level-high); color: var(--level-high-ink); }
  .chip--medium { background: var(--level-medium); color: var(--level-medium-ink); }
  .chip--low { background: var(--level-low); color: var(--level-low-ink); }
  .you-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .inset { display: block; width: 100%; border: 0; border-radius: var(--radius-control); background: var(--field); box-shadow: var(--soft-pressed); padding: 10px 14px; min-height: 84px; resize: vertical; }
  .inset::placeholder { color: var(--ink-2); }

  /* layout: a glass bar on top, content below */
  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; gap: 22px; padding: 12px 28px;
    background: var(--surface); -webkit-backdrop-filter: var(--card-blur); backdrop-filter: var(--card-blur); box-shadow: inset 0 -1px 0 var(--glass-line); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--ground); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
  .brand svg { width: 28px; height: 28px; }
  .brand b { font-size: 16px; } .brand span { display: block; font-size: 12.5px; color: var(--ink-2); }
  .nav { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
  .nav a { display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 14px; border-radius: var(--radius-control);
    text-decoration: none; color: var(--ink); font-weight: 500; }
  .nav a:hover { background: var(--control); }
  .nav a[aria-current="page"] { background: var(--control-on); box-shadow: var(--soft-pressed); color: var(--accent); font-weight: 600; }
  .badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--primary); color: var(--on-primary); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .theme-switch { display: flex; gap: 6px; }
  .theme-switch .btn { min-height: 34px; padding: 0 12px; font-size: 13px; flex: 1; }

  main { max-width: 1320px; margin: 0 auto; padding: 26px 32px 60px; min-width: 0; }
  .demo-note { font-size: 12.5px; color: var(--ink-2); margin-bottom: 12px; }
  .back { display: inline-flex; align-items: center; min-height: 32px; text-decoration: none; font-weight: 500; font-size: 14px; margin-bottom: 6px; }
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px 30px; margin-bottom: 22px; }
  .head h1 { font-size: clamp(44px, 5vw, 72px); line-height: .95; letter-spacing: -.03em; font-weight: 600; font-stretch: 75%; }
  .page-title { font-size: 40px; font-weight: 600; font-stretch: 75%; letter-spacing: -.01em; margin-bottom: 4px; }
  .facts { display: flex; flex-wrap: wrap; gap: 10px; }
  .fact { background: var(--surface); -webkit-backdrop-filter: var(--card-blur); backdrop-filter: var(--card-blur); box-shadow: var(--soft-raised);
    border-radius: var(--radius-control); padding: 10px 14px; font-size: 13px; color: var(--ink-2); }
  .fact b { display: block; font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1.2; }

  .grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); gap: 22px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .pair { display: grid; grid-template-columns: 1fr; gap: 22px; }
  .link-wrap { position: relative; }
  .link-tip { position: absolute; z-index: 5; pointer-events: none; min-width: 220px; max-width: 320px; background: var(--ink); color: var(--ground);
    border-radius: 14px; padding: 10px 12px; font-size: 13px; line-height: 1.4; transform: translate(-50%, calc(-100% - 12px)); opacity: 0; transition: opacity .1s; }
  .link-tip.show { opacity: 1; }
  .link-tip b { display: block; font-size: 14px; margin-bottom: 4px; }
  .link-tip ul { margin: 0; padding-left: 16px; }
  .q { font-size: 14px; color: var(--ink-2); margin: -6px 0 14px; }
  .q b { color: var(--ink); font-weight: 600; }
  .answer { padding: 12px 14px; border-radius: 18px; background: var(--control); box-shadow: var(--soft-raised); margin-bottom: 10px; font-size: 14.5px; }
  .answer-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 4px; }
  .answer-head b { color: var(--accent); font-size: 13.5px; }
  .answer-meta { display: flex; gap: 12px; color: var(--ink-2); font-size: 12.5px; margin-top: 6px; }
  .reply { margin: 8px 0 0 14px; padding: 6px 0 6px 12px; border-left: 2px solid var(--line); font-size: 14px; }
  .reply b { color: var(--accent); font-size: 13px; margin-right: 6px; }
  .verdict { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 8px; background: var(--control-on); color: var(--accent); }
  .verdict.no { background: var(--level-low); color: var(--level-low-ink); }
  .risk-group { margin-top: 18px; }
  .answer--strong { box-shadow: inset 0 0 0 2px var(--accent), var(--soft-raised); }
  .xid { font-weight: 700; color: var(--accent); font-size: 13.5px; }
  .track { font-size: 12.5px; color: var(--ink-2); }
  .track-badge { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: var(--primary); color: var(--on-primary); }
  .compare { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
  .compare .chip-btn[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); font-weight: 600; }
  .bar .ghost { position: absolute; top: -3px; width: 0; height: 14px; border-left: 2px dashed var(--ink-2); }
  .delta-up { color: var(--level-high); font-weight: 600; } .delta-down { color: var(--accent); font-weight: 600; }
  :root[data-theme="dark"] .delta-up { color: #ff9db1; }
  table.history { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .history th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12.5px; padding: 6px 8px; }
  .history td { padding: 8px; border-top: 1px solid var(--line); }
  .agree-list { display: grid; gap: 12px; }
  .agree-item { display: grid; gap: 10px; text-align: left; width: 100%; border: 0; border-left: 4px solid var(--edge, var(--line)); border-radius: 22px;
    padding: 14px 16px; background: var(--control); box-shadow: var(--soft-raised); color: var(--ink); }
  .agree-item--high { --edge: var(--level-high); } .agree-item--medium { --edge: var(--level-medium); } .agree-item--low { --edge: var(--level-low); }
  .agree-item:hover .statement { text-decoration: underline; }
  .agree-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .statement { font-size: 15.5px; font-weight: 500; line-height: 1.35; }
  .agree-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .agree-row .agree-bar { height: 12px; position: relative; }
  .agree-row .ghost { position: absolute; top: -3px; height: 18px; border-left: 2px dashed var(--ink); }
  .agree-nums { font-size: 13.5px; color: var(--ink-2); white-space: nowrap; }
  .agree-nums b { color: var(--ink); }
  .changes { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; font-size: 14px; }
  .risk-group > h5 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  h3 { font-size: 19px; font-weight: 600; letter-spacing: -.005em; }
  .empty { color: var(--ink-2); font-size: 14px; background: var(--field); box-shadow: var(--soft-pressed); border-radius: var(--radius-control); padding: 12px 14px; }

  /* AI draft */
  .ai { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .ai-mark { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: var(--control-on); color: var(--accent); font-weight: 700; }
  .ai-title { flex: 1; min-width: 200px; }
  .ai-title .muted { display: block; }
  .ai-text { flex-basis: 100%; font-size: 16px; line-height: 1.6; max-width: 72ch; padding-top: 6px; }

  /* forecasts across risks */
  .big { font-size: 56px; font-weight: 600; font-stretch: 75%; line-height: 1; letter-spacing: -.02em; }
  .sum-row { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 14px; }
  .sum-row .muted { max-width: 30ch; }
  .bars { display: flex; flex-direction: column; gap: 4px; }
  .bar-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 90px 38px; gap: 8px; align-items: center; font-size: 13.5px; min-height: 32px; }
  .bar-row input { width: 18px; height: 18px; accent-color: var(--primary); }
  .bar-row .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-row.off .lbl, .bar-row.off .num { opacity: .45; }
  .bar { height: 8px; background: var(--field); border-radius: 5px; overflow: hidden; box-shadow: var(--soft-pressed); }
  .bar span { display: block; height: 100%; background: var(--primary); border-radius: 5px; }
  .note { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }

  /* cross-border links */
  .links-svg { width: 100%; height: auto; display: block; }
  .links-svg .edge { stroke: var(--accent); stroke-width: 2; }
  .links-svg .edge.ext { stroke: var(--ink-2); stroke-dasharray: 4 4; opacity: .7; }
  .links-svg .elabel { font-size: 12px; fill: var(--ink-2); }
  .links-svg .cnode circle { fill: var(--control); stroke: var(--accent); stroke-width: 2; }
  .links-svg .cnode.center circle { fill: var(--primary); stroke: none; }
  .links-svg .cnode.center text { fill: #ffffff; }
  .links-svg .cnode.ext circle { stroke: var(--ink-2); stroke-dasharray: 3 3; }
  .links-svg .cnode text { font-size: 13px; fill: var(--ink); font-weight: 600; }
  .links-svg .cnode.link { cursor: pointer; }
  .links-svg .cnode.link:hover circle, .links-svg .cnode.link:focus circle { fill: var(--control-on); }

  /* risk rows, as in the app's RiskRow */
  .risk-list { display: grid; gap: 12px; }
  .risk-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; text-align: left; width: 100%;
    padding: 12px 14px 12px 14px; border: 0; border-left: 4px solid var(--edge, var(--line)); border-radius: 22px;
    background: var(--control); box-shadow: var(--soft-raised); color: var(--ink); }
  .risk-row--high { --edge: var(--level-high); } .risk-row--medium { --edge: var(--level-medium); } .risk-row--low { --edge: var(--level-low); }
  .risk-row__title { color: var(--accent); font-weight: 500; line-height: 1.3; }
  .risk-row__meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; }
  .scale { display: inline-flex; gap: 3px; }
  .scale i { width: 14px; height: 6px; border-radius: 3px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); display: inline-block; }
  .scale i.acaps { background: var(--ink-2); box-shadow: none; } .scale i.exp { background: var(--accent); box-shadow: none; }
  .scale i.both { background: linear-gradient(90deg, var(--ink-2) 50%, var(--accent) 50%); box-shadow: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; color: var(--ink-2); margin-top: 12px; }
  .legend i { width: 14px; height: 6px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .flagged { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-btn { background: var(--control); box-shadow: var(--soft-raised); color: var(--ink); min-height: 36px; padding: 0 14px; }
  .chip-btn[aria-expanded="true"] { background: var(--control-on); box-shadow: var(--soft-pressed); color: var(--accent); font-weight: 600; }
  .chip-btn .n { color: var(--accent); font-weight: 700; }
  .quote { margin-top: 12px; font-size: 18px; line-height: 1.3; }
  .quote small { display: block; font-size: 13px; color: var(--ink-2); font-weight: 400; font-stretch: 100%; margin-top: 4px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .list li { display: flex; gap: 10px; align-items: baseline; }

  /* map */
  .map-card { position: relative; padding: 16px; }
  .world { width: 100%; height: auto; display: block; }
  .world path { fill: var(--map-land); stroke: transparent; }
  .world path.active { cursor: pointer; stroke: var(--ground); stroke-width: .6; }
  .world path.up { fill: var(--map-up); } .world path.flat { fill: var(--map-flat); } .world path.down { fill: var(--map-down); }
  .world path.active:hover, .world path.active:focus { stroke: var(--ink); stroke-width: 1.4; outline: none; }
  .map-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--ink-2); margin: 12px 6px 0; align-items: center; }
  .map-legend i { display: inline-block; width: 14px; height: 14px; border-radius: 5px; margin-right: 6px; vertical-align: -2px; }
  .map-tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--ground); border-radius: 10px; padding: 6px 10px; font-size: 13px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); opacity: 0; transition: opacity .1s; }
  .map-tip.show { opacity: 1; }
  .country-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

  /* queues */
  .split { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, 1fr); gap: 22px; align-items: start; }
  .queue { display: grid; gap: 10px; }
  .queue-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; text-align: left; width: 100%; border: 0;
    border-radius: 22px; padding: 12px 16px; background: var(--control); box-shadow: var(--soft-raised); color: var(--ink); }
  .queue-row[aria-current="true"] { background: var(--control-on); box-shadow: var(--soft-pressed); }
  .queue-row b { font-weight: 600; }
  .queue-row .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .detail h2 { font-size: 30px; font-weight: 600; font-stretch: 75%; line-height: 1.1; }

/* ===== smooth "wave" line chart, drawn as SVG ===== */
const CHARTS = {};
function waveChart(key, { labels, series, fmt = pct, height = 240 }) {
  CHARTS[key] = { labels, series, fmt };
  const W = 820, H = height, L = 46, R = 18, T = 14, B = 30, iw = W - L - R, ih = H - T - B;
  const x = (i) => L + (iw * i) / (labels.length - 1), y = (v) => T + ih * (1 - v);
  const smooth = (vals) => { const pts = vals.map((v, i) => [x(i), y(v)]); let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`; }
    return d; };
  const grid = [0, .25, .5, .75, 1].map((v) => `<line class="wg" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="wy" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join("");
  const xl = labels.map((l, i) => `<text class="wx" x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`).join("");
  const areas = series.map((s, k) => `<path class="warea" data-s="${k}" d="${smooth(s.values)} L${x(labels.length - 1)},${y(0)} L${x(0)},${y(0)} Z" fill="url(#g-${key}-${k})"/>`).join("");
  const defs = series.map((s, k) => `<linearGradient id="g-${key}-${k}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity="${series.length > 2 ? .10 : .22}"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join("");
  const lines = series.map((s, k) => `<path class="wline" data-s="${k}" d="${smooth(s.values)}" stroke="${s.color}"/><circle class="wdot" data-s="${k}" cx="${x(labels.length - 1)}" cy="${y(s.values.at(-1))}" r="4.5" fill="${s.color}"/>`).join("");
  return `<div class="wave" data-chart="${key}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map((s) => `${s.name}: ${s.values.map(fmt).join(", ")}`).join("; "))}">
      <defs>${defs}</defs>${grid}${xl}${areas}${lines}
      <line class="wguide" x1="0" x2="0" y1="${T}" y2="${T + ih}" style="opacity:0"/>
      <rect class="whit" x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/>
    </svg>
    <div class="wtip"></div>
    ${series.length > 1 ? `<div class="wlegend">${series.map((s, k) => `<button class="wkey" data-s="${k}"><i style="background:${s.color}"></i>${esc(s.name)}</button>`).join("")}</div>` : ""}
  </div>`;
}
function wireCharts(root = document) {
  root.querySelectorAll(".wave").forEach((el) => {
    const c = CHARTS[el.dataset.chart]; if (!c) return;
    const svg = el.querySelector("svg"), tip = el.querySelector(".wtip"), guide = el.querySelector(".wguide"), hit = el.querySelector(".whit");
    const n = c.labels.length, L = 46, iw = 820 - 46 - 18;
    hit.addEventListener("mousemove", (ev) => {
      const b = svg.getBoundingClientRect(), sx = 820 / b.width, vx = (ev.clientX - b.left) * sx;
      const i = Math.max(0, Math.min(n - 1, Math.round(((vx - L) / iw) * (n - 1)))), gx = L + (iw * i) / (n - 1);
      guide.setAttribute("x1", gx); guide.setAttribute("x2", gx); guide.style.opacity = 1;
      tip.innerHTML = `<b>${esc(c.labels[i])}</b>` + c.series.map((s) => `<div><i style="background:${s.color}"></i>${esc(s.name)} <span>${c.fmt(s.values[i])}</span></div>`).join("");
      tip.style.left = (gx / sx) + "px"; tip.classList.add("show");
    });
    hit.addEventListener("mouseleave", () => { guide.style.opacity = 0; tip.classList.remove("show"); });
    el.querySelectorAll(".wkey").forEach((k) => {
      const on = () => { el.classList.add("focus"); el.querySelectorAll("[data-s]").forEach((p) => p.classList.toggle("lit", p.dataset.s === k.dataset.s)); };
      const off = () => { el.classList.remove("focus"); };
      k.addEventListener("mouseenter", on); k.addEventListener("focus", on); k.addEventListener("mouseleave", off); k.addEventListener("blur", off);
    });
  });
}
function agreeHistogram(rounds, { height = 150, labels = true } = {}) {
  const W = 360, H = height, L = 8, R = 8, T = 16, B = 22, mid = T + (H - T - B) / 2, half = (H - T - B) / 2;
  const max = Math.max(1, ...rounds.map((x) => Math.max(x.yes, x.no))), slot = (W - L - R) / rounds.length, bw = Math.min(30, slot * .55);
  return `<svg class="hist" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(rounds.map((x) => `${x.month}: ${x.yes} agree, ${x.no} disagree`).join("; "))}">
    <line class="hz" x1="${L}" x2="${W - R}" y1="${mid}" y2="${mid}"/>
    ${rounds.map((x, i) => { const cx = L + slot * i + slot / 2, hy = (x.yes / max) * half, hn = (x.no / max) * half;
      return `<g><title>${esc(x.month)}: ${x.yes} agree, ${x.no} disagree</title>
        <rect class="hy" x="${cx - bw / 2}" y="${mid - hy}" width="${bw}" height="${Math.max(hy, 0)}" rx="5"/>
        <rect class="hn" x="${cx - bw / 2}" y="${mid}" width="${bw}" height="${Math.max(hn, 0)}" rx="5"/>
        ${labels && x.yes ? `<text class="hv" x="${cx}" y="${mid - hy - 4}" text-anchor="middle">${x.yes}</text>` : ""}
        ${labels && x.no ? `<text class="hv" x="${cx}" y="${mid + hn + 12}" text-anchor="middle">${x.no}</text>` : ""}
        <text class="hm" x="${cx}" y="${H - 4}" text-anchor="middle">${esc(x.month)}</text></g>`; }).join("")}
  </svg>`;
}

function parseCsv(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; }
    else if (ch === '"') q = true; else if (ch === ",") { row.push(cell); cell = ""; } else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; } else cell += ch; }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim()));
}

/* ===== helpers ===== */
const SCALE = ["Very unlikely", "Unlikely", "Neutral", "Likely", "Very likely"]; // same words as the expert app
const HORIZON = "the next 2 months";
const QUESTION_AGREE = "Do you agree with this statement?";
const QUESTION_LIKELY = `How likely is this to happen in ${HORIZON}?`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = (c) => c.toLowerCase().replace(/[^a-z]+/g, "-");
const risksFor = (c) => RISKS.filter((r) => r.countries.includes(c));
const pct = (x) => Math.round(x * 100) + "%";
function stats(c) {
  const rs = risksFor(c), shift = rs.reduce((s, r) => s + r.trend, 0) / rs.length;
  return { rs, answers: rs.reduce((s, r) => s + r.n, 0), higher: rs.filter((r) => r.trend > 0).length, lower: rs.filter((r) => r.trend < 0).length,
    dir: shift > .25 ? "up" : shift < -.25 ? "down" : "flat" };
}
const threadCount = (rids) => rids.reduce((s, id) => { const a = APP_ANSWERS[id] || []; return { answers: s.answers + a.length, replies: s.replies + a.reduce((n, x) => n + x.replies.length, 0) }; }, { answers: 0, replies: 0 });
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const MAP_WORD = { up: "forecasts mostly higher", flat: "forecasts mostly unchanged", down: "forecasts mostly lower" };
const state = { compare: null, focus: {}, reviewed: new Set(), flagged: new Set(), notes: {}, openTopic: null, summaryOpen: false };

  return `<p class="q">Each card shows ACAPS’s statement. Experts answer <b>“${QUESTION_AGREE}”</b> with Agree or Disagree.</p>
    <div class="compare" role="group" aria-label="Compare with an earlier month"><span class="muted">Compare with:</span>
      <button class="chip chip-btn" data-compare="" aria-pressed="${!cmp}">Now only</button>

    ${cmp ? (moved.length ? `<ul class="changes">${moved.map(({ r, a }) => `<li><b>${esc(r.short)}</b>: agreement <span class="${a > 0 ? "delta-down" : "delta-up"}">${a > 0 ? "up" : "down"} from ${pct(r.hist[cmp].agree)} to ${pct(r.agree / r.n)}</span></li>`).join("")}</ul>`

    <div class="agree-list">${rs.map((r) => { const share = r.agree / r.n, h = cmp ? r.hist[cmp] : null;
      return `<button class="agree-item agree-item--${r.level.toLowerCase()}" data-risk="${r.id}">
        <span class="agree-top"><span class="chip chip--${r.level.toLowerCase()}">${r.level} risk</span><span class="muted">${r.n} of ${r.panel} experts answered</span>${state.flagged.has(r.id) ? `<span class="flagged"><span class="you-dot"></span>Flagged</span>` : ""}</span>

}
let linkTips = [];
function viewLinks(c, focus) {

  if (!rows.length) return `<p class="empty">${focus ? "This risk doesn’t depend on another country." : `No cross-border links for ${esc(c)} yet.`}</p>`;
  const by = {}; rows.forEach(([, b, rid, why]) => (by[b] ||= []).push([rid, why]));
  const names = Object.keys(by), W = 900, H = 320, cx = W / 2, cy = H / 2;
  linkTips = names.map((n) => ({ name: n, items: by[n] }));
  const os = names.map((name, i) => { const ang = -Math.PI / 2 + (i * 2 * Math.PI) / names.length + (names.length === 1 ? Math.PI / 2 : 0);
    return { name, i, x: cx + Math.cos(ang) * 300, y: cy + Math.sin(ang) * 112, ext: !COUNTRIES.includes(name) }; });
  return `<div class="link-wrap" id="link-wrap"><svg class="links-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Countries linked to ${esc(c)}">

  </svg><div class="link-tip" id="link-tip"></div></div>`;
}
function wireLinkTips() {
  const wrap = document.getElementById("link-wrap"); if (!wrap) return;

  wrap.querySelectorAll("[data-tip-i]").forEach((g) => {
    const show = () => { const t = linkTips[+g.dataset.tipI], b = wrap.getBoundingClientRect(), q = g.getBoundingClientRect();
      tip.innerHTML = `<b>${esc(t.name)}</b><ul>${t.items.map(([rid, why]) => `<li>${esc(riskById[rid] ? riskById[rid].short : rid)}: ${esc(why)}</li>`).join("")}</ul>`;
      tip.style.left = (q.left + q.width / 2 - b.left) + "px"; tip.style.top = (q.top - b.top) + "px"; tip.classList.add("show"); };
    const hide = () => tip.classList.remove("show");
    g.addEventListener("mouseenter", show); g.addEventListener("focus", show); g.addEventListener("mouseleave", hide); g.addEventListener("blur", hide);
  });
}

function thread(rid) {
  const ans = (APP_ANSWERS[rid] || []).map((a, i) => ({ ...a, i, id: idFor(a.name, rid), tr: trackOf(idFor(a.name, rid)) }))
    .sort((x, y) => (y.tr.right / y.tr.resolved) - (x.tr.right / x.tr.resolved));
  if (!ans.length) return `<p class="empty">No answers on this risk yet.</p>`;
  return ans.map((a) => `<div class="answer${a.tr.strong ? " answer--strong" : ""}">
    <div class="answer-head"><button class="xid" data-expert="${a.id}" title="Open this expert’s account">${a.id}</button>${a.tr.strong ? `<span class="track-badge">Strong track record</span>` : ""}<span class="verdict${a.verdict === "no" ? " no" : ""}">${a.verdict === "yes" ? "Agree" : "Disagree"}</span><span class="muted" style="font-size:12.5px">${SCALE[a.forecast - 1]}</span></div>
    <div class="track">${a.tr.right} of ${a.tr.resolved} resolved forecasts right</div>
    <div style="margin-top:4px">${esc(a.text)}</div>
    <div class="answer-meta"><span>${LIKES(a.text, a.i)} likes</span><span>${a.replies.length} ${a.replies.length === 1 ? "reply" : "replies"}</span></div>

    ${onlyRid ? `<button class="link-btn" data-act="open-chat">See all of ${esc(c)}’s answers</button>` : ""}
    ${rids.map((id) => `<div class="risk-group"><h5>${esc(riskById[id].short)}</h5>${thread(id)}</div>`).join("") || `<p class="empty">No answers yet.</p>`}
    <p class="muted" style="margin-top:10px">Showing every answer and reply, experts with the best track record first. Experts see each other under a different name for every risk; you see one stable ID per expert, never a name.</p>`);
}

/* ===== experts to approve ===== */
let selApplicant = null; const decisions = {};
function renderApprovals() {
  const a = APPLICANTS.find((x) => x.id === selApplicant) || APPLICANTS[0];
  if (a) selApplicant = a.id;
  document.getElementById("main").innerHTML = `
    <p class="demo-note">Demo · all applicants are synthetic.</p>
    <h1 class="page-title">Experts to approve</h1>
    <p class="muted" style="margin-bottom:18px">Approve each country and domain separately.</p>
    ${!APPLICANTS.length ? `<p class="empty">No applications waiting.</p>` : `
    <div class="split">
      <div class="queue">${APPLICANTS.map((x) => `<button class="queue-row" data-applicant="${x.id}" aria-current="${x.id === selApplicant}">
        <b>${esc(x.label)}</b><span class="muted">${esc(x.applied)}</span>
        <span class="meta">${x.reqs.map(([, v]) => `<span class="chip chip--area">${esc(v)}</span>`).join("")}</span></button>`).join("")}</div>
      <section class="soft-card detail" aria-live="polite">
        <h2>${esc(a.label)}</h2><p class="muted">${esc(a.privacy)} · applied ${esc(a.applied)}</p>
        <h4>About</h4><p>${esc(a.note)}</p><p class="muted" style="margin-top:4px">${esc(a.edu)}</p>
        <h4>Documents</h4><div class="chips">${a.docs.map((f) => `<button class="chip chip-btn" data-act="doc">${esc(f)}</button>`).join("")}</div>
        <h4>Requests</h4>
        ${a.reqs.map(([k, v], i) => { const dec = (decisions[a.id] || {})[i];
          return `<div class="req"><span><span class="muted">${k}</span><br>${esc(v)}</span><span class="seg">
            <button class="btn btn-soft" data-dec="${i}" data-val="yes" aria-pressed="${dec === "yes"}">Approve</button><button class="btn btn-soft deny" data-dec="${i}" data-val="no" aria-pressed="${dec === "no"}">Deny</button></span></div>`; }).join("")}
        <h4>Note to the applicant (optional)</h4><textarea class="inset" placeholder="For example: please send proof of work in Sudan."></textarea>
        <div class="row-actions"><button class="btn btn-primary" data-act="send-decision">Send decision</button><button class="link-btn" data-act="approve-all">Approve all</button></div>
        ${a.privacy === "Verified, then deleted" ? `<p class="muted" style="margin-top:10px">After approval, this applicant’s name and documents are deleted.</p>` : ""}
      </section>
    </div>`}`;
}

/* ===== emerging risks ===== */
let selEmerging = null;
function renderEmerging() {
  const e = EMERGING.find((x) => x.id === selEmerging) || EMERGING[0];
  if (e) selEmerging = e.id;
  document.getElementById("main").innerHTML = `
    <p class="demo-note">Demo · suggestions are synthetic.</p>
    <h1 class="page-title">New risks and triggers</h1>
    <p class="muted" style="margin-bottom:18px">What experts suggested that isn’t in ACAPS’s list yet.</p>
    ${!EMERGING.length ? `<p class="empty">Nothing waiting. New suggestions from experts appear here.</p>` : `
    <div class="split">
      <div class="queue">${EMERGING.slice().sort((x, y) => y.experts - x.experts).map((x) => `<button class="queue-row" data-emerging="${x.id}" aria-current="${x.id === selEmerging}">
        <b>${esc(x.title)}</b><span class="muted">${esc(x.first)}</span>
        <span class="meta"><span class="chip chip--area">${x.type === "trigger" ? "New trigger" : "New risk"}</span><span class="chip chip--area">${esc(x.country)}</span><span class="chip chip--area">Raised by ${x.experts} experts</span>${COUNTRIES.includes(x.country) ? "" : `<span class="chip chip--area">No active risk there</span>`}</span></button>`).join("")}</div>
      <section class="soft-card detail" aria-live="polite">
        <h2>${esc(e.title)}</h2><p class="muted">${esc(e.country)} · first raised ${esc(e.first)}</p>
        <h4>What experts wrote</h4>${e.notes.map((n) => `<div class="comment"><div>${esc(n)}</div></div>`).join("")}
        <h4>${e.type === "trigger" ? "Suggested for" : "Closest existing risk"}</h4>
        ${e.closest ? `<button class="chip chip-btn" data-risk="${e.closest}">${esc(riskById[e.closest].short)}</button>` : `<p class="empty">None found.</p>`}
        <div class="row-actions">${e.type === "trigger"
          ? `<button class="btn btn-primary" data-act="add-trigger">Add trigger to this risk</button>`
          : `<button class="btn btn-primary" data-act="add-risk">Add as new risk</button>${e.closest ? `<button class="btn btn-soft" data-act="add-trigger">Add as trigger to ${esc(riskById[e.closest].short)}</button>` : ""}`}
          <button class="link-btn" data-act="dismiss">Dismiss</button></div>
      </section>
    </div>`}`;
}

/* ===== render + events ===== */
function render() {
  const r = route(); renderNav(r);
  if (r.page === "experts") renderExperts(); else if (r.page === "upload") renderUpload(); else if (r.page === "approvals") renderApprovals(); else if (r.page === "emerging") renderEmerging(); else if (r.page === "map") renderMap(); else renderCountry(r.country);
}
window.addEventListener("hashchange", () => { closeDrawer(); state.openTopic = null; state.summaryOpen = false; render(); window.scrollTo(0, 0); });
document.addEventListener("change", (ev) => {
  if (ev.target.id === "up-file" && ev.target.files[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      const rows = parseCsv(String(reader.result)), head = rows[0] || [], ti = head.findIndex((h) => /title/i.test(h)), si = head.findIndex((h) => /^status$/i.test(h.trim()));
      const body = rows.slice(1).filter((r) => si < 0 || /active/i.test(r[si] || ""));
      document.getElementById("up-import").innerHTML = ti < 0 ? `<p class="empty" style="margin-top:10px">No “Risk Title” column found. Is this a Risk Radar export?</p>`
        : `<p style="margin:12px 0 6px"><b>${body.length}</b> active risks found</p><ul class="list">${body.slice(0, 5).map((r) => `<li>${esc(r[ti])}</li>`).join("")}${body.length > 5 ? `<li class="muted">and ${body.length - 5} more</li>` : ""}</ul>
           <div class="row-actions"><button class="btn btn-primary" data-act="publish-import" data-n="${body.length}">Publish all ${body.length}</button></div>`;
    };
    reader.readAsText(ev.target.files[0]);
  } else if (ev.target.closest?.("#up-form")) updatePreview();
});
document.addEventListener("input", (ev) => {
  if (ev.target.closest?.("#up-form")) updatePreview(); if (ev.target.id === "note") state.notes[ev.target.dataset.id] = ev.target.value; });
document.addEventListener("click", (ev) => {
  const t = ev.target, r = route(), q = (s) => t.closest(s);
  if (q("[data-act=close]") || t.id === "scrim") return closeDrawer();
  if (q("[data-theme-set]")) { const v = q("[data-theme-set]").dataset.themeSet; document.documentElement.dataset.theme = v; try { localStorage.setItem("analystTheme", v); } catch (e) {} return render(); }
  if (q("[data-country]")) { location.hash = "country-" + slug(q("[data-country]").dataset.country); return; }
  if (q("[data-expert]")) return openExpert(q("[data-expert]").dataset.expert, Boolean(q("#drawer")));
  if (q("[data-act=drawer-back]")) { document.getElementById("drawer").innerHTML = drawerStack.pop(); return wireCharts(document.getElementById("drawer")); }
  if (q("[data-acct-filter]")) { acct.filter = q("[data-acct-filter]").dataset.acctFilter; return render(); }
  if (q("[data-acct-sort]")) { acct.sort = q("[data-acct-sort]").dataset.acctSort; return render(); }
  if (q("[data-up-country]")) { const b = q("[data-up-country]"); b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true")); return updatePreview(); }
  if (q("[data-up-seg] [data-val]")) { const b = q("[data-up-seg] [data-val]"); b.parentElement.querySelectorAll("[data-val]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); return updatePreview(); }
  if (q("[data-act=add-trigger-field]")) { const i = document.createElement("input"); i.className = "inset one"; i.name = "trigger"; i.placeholder = "Another trigger"; document.getElementById("up-triggers").append(i); return i.focus(); }
  if (q("[data-act=publish-risk]") || q("[data-act=save-draft]")) {
    const u = readUpload(), publish = Boolean(q("[data-act=publish-risk]"));
    if (!u.title) return toast("Write the risk statement first");
    if (publish && !u.countries.length) return toast("Pick at least one country");
    const all = Object.values(EXPERTS), n = all.filter((e) => u.countries.some((c) => e.countries.has(c)) || e.domains.has(CAT[u.cat])).length;
    uploaded.unshift({ title: u.title, countries: u.countries.join(", ") || "No country yet", status: publish ? "Published" : "Draft" });
    render(); return toast(publish ? `Published to ${n} experts` : "Draft saved");
  }
  if (q("[data-act=publish-import]")) { const n = q("[data-act=publish-import]").dataset.n; document.getElementById("up-import").innerHTML = ""; return toast(`${n} risks published to experts`); }
  if (q("[data-compare]")) { state.compare = q("[data-compare]").dataset.compare || null; return render(); }
  if (q("[data-focus]")) { const v = q("[data-focus]").dataset.focus; state.focus[r.country] = v || null; state.openTopic = null; return render(); }
  if (q("[data-topic]")) { const i = +q("[data-topic]").dataset.topic; state.openTopic = state.openTopic === i ? null : i; return render(); }
  if (q("[data-act=toggle-summary]")) { state.summaryOpen = !state.summaryOpen; return render(); }
  if (q("[data-act=open-chat]")) return openChat(r.country, q("[data-act=open-chat]").dataset.rid);
  if (q("[data-act=approve-summary]")) { state.reviewed.add(r.country); closeDrawer(); render(); return toast("Summary marked as checked"); }
  if (q("[data-act=edit-summary]")) return toast("Editing opens here in the full version");
  if (q("[data-act=flag]")) { const id = q("[data-act=flag]").dataset.id; state.flagged.has(id) ? state.flagged.delete(id) : state.flagged.add(id); render(); openRisk(id); return toast(state.flagged.has(id) ? "Flagged for the next update" : "Flag removed"); }
  if (q("[data-act=ask]")) { const id = q("[data-act=ask]").dataset.id;
    document.getElementById("ask-box").innerHTML = `<textarea class="inset" id="ask-text" style="margin-top:12px" placeholder="For example: have you seen new movement at the Adre crossing this week?"></textarea>
      <div class="row-actions"><button class="btn btn-primary" data-act="send-ask" data-id="${id}">Send to ${riskById[id].n} experts</button></div>`;
    return document.getElementById("ask-text").focus(); }
  if (q("[data-act=send-ask]")) { const id = q("[data-act=send-ask]").dataset.id;
    if (!document.getElementById("ask-text").value.trim()) return toast("Write your question first");
    document.getElementById("ask-box").innerHTML = ""; return toast(`Question sent to ${riskById[id].n} experts`); }
  if (q("[data-risk]")) return openRisk(q("[data-risk]").dataset.risk);
  if (q("[data-applicant]")) { selApplicant = q("[data-applicant]").dataset.applicant; return render(); }
  if (q("[data-dec]")) { const b = q("[data-dec]"); (decisions[selApplicant] ||= {})[b.dataset.dec] = b.dataset.val; return render(); }
  if (q("[data-act=approve-all]")) { const a = APPLICANTS.find((x) => x.id === selApplicant); decisions[a.id] = Object.fromEntries(a.reqs.map((_, i) => [i, "yes"])); return render(); }
  if (q("[data-act=send-decision]")) {
    const a = APPLICANTS.find((x) => x.id === selApplicant), dec = decisions[a.id] || {};
    if (Object.keys(dec).length < a.reqs.length) return toast("Approve or deny every request first");
    const ok = Object.values(dec).filter((v) => v === "yes").length;
    APPLICANTS = APPLICANTS.filter((x) => x.id !== a.id); selApplicant = null; render();
    return toast(`Decision sent: ${ok} of ${a.reqs.length} approved`);
  }
  if (q("[data-act=doc]")) return toast("Documents open here in the full version");
  if (q("[data-emerging]")) { selEmerging = q("[data-emerging]").dataset.emerging; return render(); }
  for (const [act, msg] of [["add-risk", "Added to ACAPS’s list for review"], ["add-trigger", "Added as a trigger"], ["dismiss", "Dismissed"]]) {
    if (q(`[data-act=${act}]`)) { EMERGING = EMERGING.filter((x) => x.id !== selEmerging); selEmerging = null; render(); return toast(msg); }
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDrawer();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".cnode.link, path.active")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});
render();
</script>
</body>
</html>
