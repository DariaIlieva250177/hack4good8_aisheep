<!doctype html>
<html lang="en" dir="ltr" data-mode="lite">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03161d" />
    <meta name="referrer" content="no-referrer" />
    <title>AI Sheep</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        // Teal dark is the default; only an explicit Light or System choice changes it.
        var t = localStorage.getItem('appTheme');
        var dark = t === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : t !== 'light';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <style>
      /* Splash: the animated ACAPS community logo while the app loads.
         Colours follow the theme the pre-paint script set above. */
      #acaps-splash {
        --bg: #e6f0f8;
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background: var(--bg);
        transition: opacity .45s ease, visibility 0s linear .45s;
      }
      :root[data-theme="dark"] #acaps-splash { --bg: #03161d; }
      #acaps-splash.is-done { opacity: 0; visibility: hidden; }
      #acaps-splash .logo { width: min(58vw, 280px); height: auto; overflow: visible; }
      #acaps-splash .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }


  #acaps-splash .logo { --ink:#000; --teal:#0196BA; --sclera:#fff; --pupil:#1C141C; }
  
  :root[data-theme="dark"] #acaps-splash .logo { --ink:#EEF3F5; --teal:#1AA8CC; }

  #acaps-splash .ink { fill: var(--ink); }
  #acaps-splash .teal { fill: var(--teal); }

  /* 1 · pin drops onto its spot and settles, squashing on its tip */
  #acaps-splash .drop { animation: drop .9s .1s both; }
  @keyframes drop {
    0%   { transform: translateY(-74px); opacity: 0; animation-timing-function: cubic-bezier(.55,0,.85,.35); }
    25%  { opacity: 1; }
    55%  { transform: translateY(0) scale(1,1); animation-timing-function: ease-out; }
    68%  { transform: scale(1.09,.86); animation-timing-function: ease-in-out; }
    84%  { transform: scale(.97,1.04); }
    100% { transform: none; opacity: 1; }
  }

  /* 2 · the wordmark rises out of its baseline, letter by letter */
  #acaps-splash .l { animation: rise .65s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(.5s + var(--i) * .06s); }
  @keyframes rise { from { transform: translateY(50px); } to { transform: none; } }

  /* 3 · "community" joins one letter at a time */
  #acaps-splash .c { fill: var(--teal); animation: join .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(1.02s + var(--i) * .055s); }
  @keyframes join { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  /* 4 · loading loop: double ping from the pin + the eye looks around */
  #acaps-splash .ring { fill: none; stroke: var(--teal); stroke-width: 2; opacity: 0;
          animation: ping 2.4s cubic-bezier(.1,.6,.3,1) infinite; }
  #acaps-splash .ring.r1 { animation-delay: .6s; }
  #acaps-splash .ring.r2 { animation-delay: .86s; }
  @keyframes ping {
    0%   { transform: scale(1);    opacity: .75; stroke-width: 2.4; }
    55%  { transform: scale(1.6);  opacity: 0;   stroke-width: .9; }
    100% { transform: scale(1.6);  opacity: 0; }
  }
  #acaps-splash .pupil { animation: look 4.8s 1.9s ease-in-out infinite; }
  @keyframes look {
    0%, 10%   { transform: none; }
    22%, 38%  { transform: translateX(-5.5px); }
    52%, 68%  { transform: translateX(5.5px); }
    80%, 100% { transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    #acaps-splash .drop, #acaps-splash .l, #acaps-splash .c, #acaps-splash .pupil { animation: none; }
    #acaps-splash .ring.r2 { display: none; }
    #acaps-splash .ring.r1 { transform: scale(1.25); animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: .15; } 50% { opacity: .6; } }
  }

    <script>
      // main.tsx calls acapsSplash.hide() once the app has rendered. The splash
      // stays until the intro has played (~1.7 s) so it never cuts off halfway.
      window.acapsSplash = (function () {
        var el = document.getElementById('acaps-splash');
        var shown = performance.now();
        var MIN_MS = 1700;
        return {
          hide: function () {
            var wait = Math.max(0, MIN_MS - (performance.now() - shown));
            setTimeout(function () {
              el.classList.add('is-done');
              el.addEventListener('transitionend', function () { el.remove(); }, { once: true });
              setTimeout(function () { el.remove(); }, 800);
            }, wait);
          },
        };
      })();
    </script>
