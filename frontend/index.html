<!doctype html>
<html lang="en" dir="ltr" data-mode="lite">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03161d" />
    <meta name="referrer" content="no-referrer" />
    <title>AI Sheep</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        // Teal dark is the default; only an explicit Light or System choice changes it.
        var t = localStorage.getItem('appTheme');
        var dark = t === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : t !== 'light';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
